name: Render Report
on:
  push:
  workflow_dispatch:
jobs:
  render-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # charged-ieee typesets in TeX Gyre Termes/Cursor
      - run: sudo apt-get update && sudo apt-get install -y fonts-texgyre
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: v0.15.1
      - run: typst compile cee492_report.typ cee492_report.pdf
      - uses: actions/upload-artifact@v7
        with:
            # archive: false uploads the PDF directly, so downloading it gives
            # you the PDF rather than a zip file you have to unpack. The
            # artifact is then named after the file: cee492_report.pdf
            archive: false
            path: cee492_report.pdf
